Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
User clamav
ReadTimeout 600
CommandReadTimeout 600
SendBufTimeout 600
StreamMaxLength 5G
# libclamav caps this at INT_MAX - 2, even when configured as 5G.
MaxFileSize 2147483645
MaxScanSize 5G
MaxScanTime 600000
MaxRecursion 30
MaxFiles 10000
AlertExceedsMax yes
# Match the host's logical CPU count so independent uploads do not queue
# behind the daemon's default ten workers. The application still limits large
# archives to two concurrent scans to keep memory bounded.
MaxThreads 16
MaxQueue 32
# Stop as soon as a heuristic threat is found; a blocked result never publishes
# the file and this avoids spending CPU after a decisive security finding.
HeuristicScanPrecedence yes
SelfCheck 600
ConcurrentDatabaseReload no
