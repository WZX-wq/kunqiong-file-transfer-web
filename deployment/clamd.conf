Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
User clamav
ReadTimeout 600
CommandReadTimeout 600
SendBufTimeout 600
StreamMaxLength 5G
MaxFileSize 5G
MaxScanSize 5G
MaxRecursion 30
MaxFiles 10000
AlertExceedsMax yes
SelfCheck 600
ConcurrentDatabaseReload no
