<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你收到一个文件分享</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f8f6;font-family:Arial,'Microsoft YaHei',sans-serif;color:#29443d;">
    <div style="padding:32px 16px;background:#f4f8f6;">
      <div style="max-width:560px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #dfeae6;border-radius:10px;">
        <p style="margin:0 0 8px;color:#168b73;font-size:12px;font-weight:bold;letter-spacing:1px;">鲲穹文件传输</p>
        <h2 style="margin:0 0 16px;font-size:22px;">你收到一个文件分享</h2>
        <p style="line-height:1.7;">{{OWNER_NAME}} 向你发送了 <strong>{{FILE_COUNT}}</strong> 个文件：{{TITLE}}</p>
        <p style="margin:20px 0 8px;color:#718982;font-size:13px;">打开链接</p>
        <p style="margin:0;word-break:break-all;">
          <a href="{{SHARE_URL}}" style="color:#168b73;">{{SHARE_URL}}</a>
        </p>
        <div style="margin-top:18px;padding:14px;background:#f1f8f5;border:1px solid #d6ebe3;border-radius:8px;">
          <span style="color:#718982;font-size:12px;">取件码</span>
          <strong style="display:block;margin-top:5px;color:#168b73;font-size:24px;letter-spacing:3px;">{{CODE}}</strong>
        </div>
        <p style="color:#718982;font-size:12px;">有效期：{{EXPIRY_TEXT}}</p>
        {{PASSWORD_HINT}}
        {{QR_IMAGE}}
        <p style="margin:24px 0 0;color:#a0b1ac;font-size:11px;line-height:1.6;">
          本邮件由鲲穹文件传输自动发送，请勿直接回复。
        </p>
      </div>
    </div>
  </body>
</html>
